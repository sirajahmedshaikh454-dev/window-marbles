<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Window Marbles</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&display=swap" rel="stylesheet">
<style>
:root { --sheet: #12284a; --chalk: #e9f1ff; --amber: #ffb43a; --dim: #8fa6c8; }
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; overflow: hidden; background: var(--sheet); color: var(--chalk); font: 500 14px/1.3 'Bricolage Grotesque', system-ui, sans-serif; }
canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: crosshair; }
.hud { position: fixed; top: 12px; left: 14px; right: 14px; display: flex; align-items: flex-start; gap: 12px; pointer-events: none; }
.hud h1 { font-weight: 800; font-size: 18px; letter-spacing: -.01em; }
.hud p { color: var(--dim); font-size: 12px; }
.score { margin-left: auto; text-align: right; }
.score b { display: block; font-weight: 800; font-size: 34px; line-height: 1; color: var(--amber); }
button { pointer-events: auto; font: inherit; font-weight: 800; color: var(--sheet); background: var(--amber); border: 0; padding: 9px 14px; min-height: 40px; border-radius: 999px; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--chalk); outline-offset: 3px; }
.hint { position: fixed; left: 50%; top: 46%; translate: -50% -50%; text-align: center; color: var(--dim); width: min(30ch, 90vw); pointer-events: none; transition: opacity .6s; }
.hint.off { opacity: 0; }
</style>
</head>
<body>
<canvas id="c" aria-label="Marbles falling between browser windows"></canvas>
<div class="hud">
  <div><h1>Window Marbles</h1><p id="status">1 window</p></div>
  <button id="spawn">+ window</button>
  <div class="score"><b id="score">0</b><p>in the cup</p></div>
</div>
<p class="hint" id="hint">Click anywhere to drop a marble.<br>Open another window, put it below this one, and catch it.</p>
<script type="module" src="app.js"></script>
</body>
</html>
